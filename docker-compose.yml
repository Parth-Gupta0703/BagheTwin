version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: baghetwin_backend
    environment:
      DATABASE_URL: sqlite:///baghetwin.db
      DEBUG: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/artifacts:/app/artifacts
      - ./backend/baghetwin.db:/app/baghetwin.db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: baghetwin_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
